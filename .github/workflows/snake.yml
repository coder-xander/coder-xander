name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Use a read-only profile PAT when available. The repository token is
          # a public-contribution fallback.
          github_token: ${{ secrets.SNAKE_PAT || secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#06b6d4&color_dots=#e2e8f0,#bae6fd,#7dd3fc,#38bdf8,#0ea5e9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#111827,#1e3a5f,#0e7490,#06b6d4,#a78bfa

      - name: Deploy to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C dist init --initial-branch=output
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add .
          git -C dist commit -m "🐍 Refresh contribution signal"
          git -C dist push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
