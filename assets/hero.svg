<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Xander — systems, devices, cloud and intelligence</title>
  <desc id="desc">A compact terminal-inspired profile banner with a connected systems diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="310" rx="22" fill="url(#bg)"/>
  <circle cx="1000" cy="60" r="180" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 255 C180 215 300 305 500 260 S860 190 1200 248" fill="none" stroke="url(#accent)" stroke-opacity=".16" stroke-width="2"/>
