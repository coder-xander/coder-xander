    <circle cx="29" cy="9" r="5" fill="#fbbf24"/>
    <circle cx="49" cy="9" r="5" fill="#34d399"/>
    <text x="0" y="65" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">xander@workbench:~$ whoami</text>
    <text x="0" y="119" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="750" letter-spacing="-1">XANDER</text>
    <text x="2" y="153" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">systems engineer / product builder</text>
    <rect x="0" y="181" width="440" height="2" rx="1" fill="url(#accent)"/>
    <text x="0" y="216" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">bare metal → edge → cloud → intelligence</text>
  </g>
  <g transform="translate(642 67)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
